version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eighty-twenty-postgres-local
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: eighty_twenty_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - eighty_twenty_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eighty_twenty_postgres_local:
